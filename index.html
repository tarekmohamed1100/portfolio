/* ---------- Hooks & small components ---------- */
const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function useInView(threshold = 0.15) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!("IntersectionObserver" in window) || reduced()) { setInView(true); return; }
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setInView(true); io.disconnect(); }
    }, { threshold });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return [ref, inView];
}

function Reveal({ children, delay = 0, className = "" }) {
  const [ref, inView] = useInView();
  return (
    <div ref={ref} className={`reveal ${inView ? "in" : ""} ${className}`} style={{ "--d": delay + "ms" }}>
      {children}
    </div>
  );
}

function Counter({ to, suffix = "" }) {
  const [ref, inView] = useInView(0.5);
  const [n, setN] = useState(0);
  useEffect(() => {
    if (!inView) return;
    if (reduced()) { setN(to); return; }
    let start = null, raf;
    const dur = 1400;
    const step = (t) => {
      if (start === null) start = t;
      const p = Math.min((t - start) / dur, 1);
      setN(Math.round((1 - Math.pow(1 - p, 3)) * to));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [inView, to]);
  return <span ref={ref} className="tabular-nums">{n}{suffix}</span>;
}

function Typing({ words }) {
  const [i, setI] = useState(0);
  const [text, setText] = useState("");
  const [del, setDel] = useState(false);
  useEffect(() => {
    if (reduced()) { setText(words[0]); return; }
    const word = words[i % words.length];
    let delay = del ? 35 : 75;
    if (!del && text === word) delay = 1500;
    const t = setTimeout(() => {
      if (!del && text === word) { setDel(true); return; }
      if (!del) { setText(word.slice(0, text.length + 1)); return; }
      if (text === "") { setDel(false); setI(i + 1); return; }
      setText(text.slice(0, -1));
    }, delay);
    return () => clearTimeout(t);
  }, [text, del, i, words]);
  return (
    <span>
      {text}
      <span className="blink inline-block w-[2px] h-[1em] translate-y-[3px] bg-[var(--accent)] align-middle ms-1" />
    </span>
  );
}

function Tilt({ children, className = "" }) {
  const ref = useRef(null);
  const onMove = (e) => {
    if (reduced() || !ref.current) return;
    const r = ref.current.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    ref.current.style.transform = `perspective(900px) rotateX(${-y * 6}deg) rotateY(${x * 6}deg) translateY(-3px)`;
  };
  const onLeave = () => { if (ref.current) ref.current.style.transform = ""; };
  return (
    <div ref={ref} onMouseMove={onMove} onMouseLeave={onLeave}
         className={`transition-transform duration-300 ease-out will-change-transform ${className}`}>
      {children}
    </div>
  );
}

      <div className="mb-2 flex justify-between text-sm">
        <span className="font-medium">{name}</span>
        <span className="muted mono tabular-nums">{level}</span>
      </div>
      <div className="h-[6px] w-full overflow-hidden rounded-full" style={{ background: "var(--line)" }}>
        <div className="h-full rounded-full transition-[width] duration-[1200ms] ease-out"
             style={{ width: inView ? level + "%" : "0%", background: "var(--accent)" }} />
      </div>
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [theme, setTheme] = useState("dark");
  const [lang, setLang] = useState("ar");
  const [menu, setMenu] = useState(false);
  const [progress, setProgress] = useState(0);
  const [toast, setToast] = useState("");
  const [form, setForm] = useState({ name: "", email: "", message: "" });
  const spotRef = useRef(null);
  const t = COPY[lang];
  const pick = (o) => o[lang];

  useEffect(() => {
    try {
      const th = localStorage.getItem("pf-theme");
      const lg = localStorage.getItem("pf-lang");
      if (th) setTheme(th);
      if (lg) setLang(lg);
    } catch (e) {}
  }, []);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", theme === "dark");
    try { localStorage.setItem("pf-theme", theme); } catch (e) {}
  }, [theme]);

  useEffect(() => {
    document.documentElement.lang = lang;
    document.documentElement.dir = COPY[lang].dir;
    try { localStorage.setItem("pf-lang", lang); } catch (e) {}
  }, [lang]);

  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      setProgress(h > 0 ? (window.scrollY / h) * 100 : 0);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  useEffect(() => {
    const fine = window.matchMedia("(pointer: fine)").matches && !reduced();
    if (!fine) return;
    const onMove = (e) => {
      if (spotRef.current) spotRef.current.style.transform = `translate(${e.clientX - 260}px, ${e.clientY - 260}px)`;
    };
    window.addEventListener("mousemove", onMove, { passive: true });
    return () => window.removeEventListener("mousemove", onMove);
  }, []);

  useEffect(() => {
    if (!toast) return;
    const id = setTimeout(() => setToast(""), 2400);
    return () => clearTimeout(id);
  }, [toast]);

  const copyEmail = async () => {
    try {
      await navigator.clipboard.writeText(DATA.email);
      setToast(t.copied);
    } catch (err) {
      setToast(DATA.email);
    }
  };

  const onSubmit = (e) => {
    e.preventDefault();
    const subject = encodeURIComponent(`${form.name} | Portfolio`);
    const body = encodeURIComponent(`${form.message}\n\n${form.email}`);
    setToast(t.sending);
    window.location.href = `mailto:${DATA.email}?subject=${subject}&body=${body}`;
  };

  const navKeys = Object.keys(t.nav);

  return (
    <>
      <div ref={spotRef} className="spot" aria-hidden="true" />

      <div className="progress fixed inset-x-0 top-0 z-[60] h-[2px]"
           style={{ transform: `scaleX(${progress / 100})` }} aria-hidden="true" />

      <header className="fixed inset-x-0 top-[2px] z-50 border-b backdrop-blur-md line" style={{ background: "color-mix(in srgb, var(--bg) 85%, transparent)" }}>
        <div className="mx-auto flex h-16 max-w-6xl items-center justify-between px-5">
          <a href="#top" className="display text-lg font-bold">{t.brand}</a>

          <nav className="hidden items-center gap-8 text-sm font-medium md:flex" aria-label="Main">
            {navKeys.map((k) => (
              <a key={k} href={"#" + k} className="nav-link">{t.nav[k]}</a>
            ))}
          </nav>

          <div className="flex items-center gap-2">
            <button onClick={() => setLang(lang === "ar" ? "en" : "ar")} className="btn-icon" aria-label="Switch language">{t.toggleLang}</button>
            <button onClick={() => setTheme(theme === "dark" ? "light" : "dark")} className="btn-icon w-9 px-0 text-base"
                    aria-label={t.toggleTheme} title={t.toggleTheme}>
              {theme === "dark" ? "☀" : "☾"}
            </button>
            <button onClick={() => setMenu(!menu)} className="btn-icon md:hidden" aria-expanded={menu} aria-label="Menu">
              {menu ? "✕" : "☰"}
            </button>
          </div>
        </div>

        <div className={`overflow-hidden px-5 transition-all duration-500 ease-out md:hidden ${menu ? "max-h-60 pb-4 opacity-100" : "max-h-0 opacity-0"}`}>
          <div className="flex flex-col gap-3 text-base font-medium">
            {navKeys.map((k) => (
              <a key={k} href={"#" + k} onClick={() => setMenu(false)} className="py-1">{t.nav[k]}</a>
            ))}
          </div>
        </div>
      </header>

      <main id="top" className="relative z-10">

        {/* HERO */}
        <section className="px-5 pb-24 pt-36 md:pt-44">
          <div className="mx-auto grid max-w-6xl items-center gap-14 md:grid-cols-2">
            <div>
              <span className="rise inline-flex items-center gap-2 rounded-full border line px-3 py-1 text-sm muted" style={{ "--d": "0ms" }}>
                <span className="ping inline-block h-2 w-2 rounded-full" style={{ background: "var(--accent)" }} />
                {t.badge}
              </span>

              <h1 className="display rise mt-6 text-5xl font-bold leading-[1.05] md:text-7xl" style={{ "--d": "100ms" }}>
                {pick({ en: "Hi, I'm ", ar: "أهلاً، أنا " })}
                <span style={{ color: "var(--accent)" }}>{pick({ en: "Tarek.", ar: "طارق." })}</span>
              </h1>

              <p className="rise mt-5 h-8 text-xl font-semibold muted" style={{ "--d": "180ms" }}>
                <Typing words={t.roles} />
              </p>

              <p className="rise mt-6 max-w-xl text-lg leading-relaxed" style={{ "--d": "260ms" }}>
                {t.headline}
              </p>
              <p className="rise muted mt-3 max-w-xl leading-relaxed" style={{ "--d": "320ms" }}>
                {t.lead}
              </p>

              <div className="rise mt-9 flex flex-wrap gap-3" style={{ "--d": "400ms" }}>
                <a href="#work" className="btn btn-solid">{t.cta1}</a>
                <a href="#contact" className="btn btn-outline">{t.cta2}</a>
              </div>
            </div>

            {/* code card */}
            <div className="rise mx-auto w-full max-w-md" style={{ "--d": "300ms" }}>
              <div className="anim-float card p-6" dir="ltr">
                <div className="mb-5 flex gap-2">
                  <span className="h-2.5 w-2.5 rounded-full line" style={{ background: "var(--line)" }} />
                  <span className="h-2.5 w-2.5 rounded-full" style={{ background: "var(--line)" }} />
                  <span className="h-2.5 w-2.5 rounded-full" style={{ background: "var(--accent)" }} />
                </div>
                <pre className="mono overflow-x-auto text-[13px] leading-relaxed muted">
{`const dev = {
  name: "Tarek",
  front: ["React", "Tailwind"],
  back: ["Node.js", "PostgreSQL"],
  ships: true,
};

await dev.build("something useful");`}
                </pre>
              </div>
            </div>
          </div>
        </section>

        {/* STATS */}
        <section className="px-5 pb-24">
          <div className="mx-auto grid max-w-5xl grid-cols-1 gap-px overflow-hidden rounded-2xl border line sm:grid-cols-3" style={{ background: "var(--line)" }}>
            {DATA.stats.map((s, i) => (
              <Reveal key={i} delay={i * 120}>
                <div className="h-full p-8 text-center" style={{ background: "var(--bg)" }}>
                  <div className="display text-5xl font-bold" style={{ color: "var(--accent)" }}><Counter to={s.to} suffix={s.suffix} /></div>
                  <div className="muted mt-2">{pick(s)}</div>
                </div>
              </Reveal>
            ))}
          </div>
          <p className="muted mt-4 text-center text-xs">{t.statsHint}</p>
        </section>

        {/* WORK */}
        <section id="work" className="scroll-mt-24 px-5 py-24">
          <div className="mx-auto max-w-6xl">
            <Reveal>
              <h2 className="display text-3xl font-bold md:text-4xl">{t.workTitle}</h2>
              <p className="muted mt-2">{t.workSub}</p>
            </Reveal>

            <div className="mt-12 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
              {DATA.projects.map((p, i) => (
                <Reveal key={i} delay={i * 120}>
                  <Tilt className="h-full">
                    <article className="card flex h-full flex-col p-5">
                      <div className="project-visual mb-5">
                        <div className="rule" />
                        <div className="absolute inset-x-0 bottom-0 flex items-end justify-center gap-3 px-6 pb-[22px]" style={{ top: 0 }}>
                          {p.bars.map((h, j) => (
                            <div key={j} className="bar" style={{ height: h + "%" }} />
                          ))}
                        </div>
                      </div>
                      <h3 className="display text-xl font-bold">{pick(p.title)}</h3>
                      <p className="muted mt-2 flex-1 leading-relaxed">{pick(p.desc)}</p>
                      <div className="mt-4 flex flex-wrap gap-2">
                        {p.tags.map((tag) => <span key={tag} className="chip">{tag}</span>)}
                      </div>
                      <div className="mt-5 flex gap-5 text-sm font-semibold">
                        {p.live && <a href={p.live} target="_blank" rel="noopener" className="transition-colors hover:text-[var(--accent)]">{t.viewLive} ↗</a>}
                        {p.repo && <a href={p.repo} target="_blank" rel="noopener" className="transition-colors hover:text-[var(--accent)]">{t.viewCode} ↗</a>}
                      </div>
                    </article>
                  </Tilt>
                </Reveal>
              ))}
            </div>
          </div>
        </section>

        {/* ABOUT */}
        <section id="about" className="scroll-mt-24 px-5 py-24">
          <div className="mx-auto max-w-6xl">
            <Reveal>
              <h2 className="display text-3xl font-bold md:text-4xl">{t.aboutTitle}</h2>
            </Reveal>
            <div className="mt-12 grid gap-6 md:grid-cols-3">
              {t.aboutCards.map((c, i) => (
                <Reveal key={i} delay={i * 120}>
                  <div className="card h-full p-7">
                    <div className="mb-5 h-[2px] w-8" style={{ background: "var(--accent)" }} />
                    <h3 className="display text-lg font-bold">{c.t}</h3>
                    <p className="muted mt-2 leading-relaxed">{c.d}</p>
                  </div>
                </Reveal>
              ))}
            </div>
          </div>
        </section>

        {/* STACK */}
        <section id="stack" className="scroll-mt-24 py-24">
          <Reveal className="mx-auto mb-12 max-w-6xl px-5">
            <h2 className="display text-3xl font-bold md:text-4xl">{t.stackTitle}</h2>
          </Reveal>

          <div className="marquee overflow-hidden border-y py-5 line">
            <div className="marquee-track display flex w-max gap-12 whitespace-nowrap text-2xl font-semibold muted">
              {[...DATA.stack, ...DATA.stack].map((s, i) => (
                <span key={i} className="transition-colors hover:text-[var(--accent)]">{s}</span>
              ))}
            </div>
          </div>

          <div className="mx-auto mt-20 grid max-w-6xl gap-12 px-5 md:grid-cols-2">
            <Reveal>
              <h3 className="display mb-6 text-xl font-bold">{t.skillsTitle} · {t.frontLabel}</h3>
              <div className="space-y-5">
                {DATA.skills.front.map((s) => <SkillBar key={s.n} name={s.n} level={s.l} />)}
              </div>
            </Reveal>
            <Reveal delay={150}>
              <h3 className="display mb-6 text-xl font-bold">{t.skillsTitle} · {t.backLabel}</h3>
              <div className="space-y-5">
                {DATA.skills.back.map((s) => <SkillBar key={s.n} name={s.n} level={s.l} />)}
              </div>
              <div className="mt-8">
                <p className="muted mb-3 text-sm">{t.toolsLabel}</p>
                <div className="flex flex-wrap gap-2">
                  {t.tools.map((tool) => <span key={tool} className="chip">{tool}</span>)}
                </div>
              </div>
            </Reveal>
          </div>
        </section>

        {/* CONTACT */}
        <section id="contact" className="scroll-mt-24 px-5 py-24">
          <div className="mx-auto grid max-w-6xl gap-12 md:grid-cols-2">
            <Reveal>
              <h2 className="display text-4xl font-bold md:text-5xl">{t.contactTitle}</h2>
              <p className="muted mt-4 max-w-md text-lg leading-relaxed">{t.contactSub}</p>
              <div className="mt-8 flex flex-wrap gap-3">
                <button onClick={copyEmail} className="btn btn-outline">{t.copy}</button>
                <a href={DATA.github} target="_blank" rel="noopener" className="btn btn-outline">GitHub</a>
                <a href={DATA.linkedin} target="_blank" rel="noopener" className="btn btn-outline">LinkedIn</a>
              </div>
            </Reveal>

            <Reveal delay={120}>
              <form onSubmit={onSubmit} className="card space-y-5 p-7">
                <div>
                  <label htmlFor="f-name" className="mb-2 block text-sm font-medium">{t.fName}</label>
                  <input id="f-name" required className="field" value={form.name}
                         onChange={(e) => setForm({ ...form, name: e.target.value })} />
                </div>
                <div>
                  <label htmlFor="f-email" className="mb-2 block text-sm font-medium">{t.fEmail}</label>
                  <input id="f-email" type="email" required dir="ltr" className="field" value={form.email}
                         onChange={(e) => setForm({ ...form, email: e.target.value })} />
                </div>
                <div>
                  <label htmlFor="f-msg" className="mb-2 block text-sm font-medium">{t.fMsg}</label>
                  <textarea id="f-msg" rows="4" required className="field resize-none" value={form.message}
                            onChange={(e) => setForm({ ...form, message: e.target.value })} />
                </div>
                <button type="submit" className="btn btn-solid w-full">{t.send}</button>
              </form>
            </Reveal>
          </div>
        </section>
      </main>

      <footer className="relative z-10 border-t px-5 py-10 text-sm muted line">
        <div className="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4">
          <span>© 2026 {pick({ en: "Tarek Mohamed Salah El-Kholy", ar: "طارق محمد صلاح الخولي" })}</span>
          <span>{t.footer}</span>
          <a href="#top" className="chip">↑ {t.top}</a>
        </div>
      </footer>

      <div role="status" aria-live="polite"
           className={`fixed bottom-6 start-1/2 z-[70] -translate-x-1/2 rounded-full px-5 py-2.5 text-sm font-medium shadow-lg transition-all duration-300 ${toast ? "translate-y-0 opacity-100" : "translate-y-4 opacity-0"}`}
           style={{ background: "var(--fg)", color: "var(--bg)" }}>
        {toast}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
